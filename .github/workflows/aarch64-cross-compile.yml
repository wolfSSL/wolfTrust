name: AArch64 cross compilation

on:
  push:
    branches: [master, main, "release/**", wolfpsa-v5.9.1-ci, wolftfm-l3, wolfTrust-dev, wolfTrust-dev2]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  qemu-a-smoke:
    name: EL3 smoke on ${{ matrix.cell.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-aarch64:v1.15
    strategy:
      fail-fast: false
      matrix:
        cell:
          - { name: virt-gicv2-a35, machine: virt, target: qemuvirt, gic: 2, cpu: cortex-a35, smp: 2 }
          - { name: virt-gicv3-a72, machine: virt, target: qemuvirt, gic: 3, cpu: cortex-a72, smp: 2 }
          - { name: versal-virt, machine: versal-virt, target: versal, gic: 3, cpu: cortex-a72, smp: 4 }
    env:
      MACHINE: ${{ matrix.cell.machine }}
      GIC: ${{ matrix.cell.gic }}
      CPU: ${{ matrix.cell.cpu }}
      SMP: ${{ matrix.cell.smp }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize wolfTrust dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --single-branch lib/wolfSSL lib/wolfHSM lib/wolfCOSE

      - name: Toolchain and emulator versions
        run: |
          aarch64-none-elf-gcc --version | head -1
          qemu-system-aarch64 --version | head -1

      - name: Self-test the EL3 symbol guard and the expect library
        run: |
          tools/check-el3-symbols.sh --selftest
          tests/target/lib/expect.sh --selftest

      - name: Cross-build the EL3 monitor image (the symbol guard runs at link)
        run: make ARCH=aarch64 TARGET=${{ matrix.cell.target }} WT_GIC_VERSION="$GIC" WT_CPU="$CPU" BUILD_DIR=build-aarch64-guard el3-image

      - name: Boot the EL3 smoke and the wolfTrust EL3 monitor
        run: tests/target/run_suite.sh qemu-a smoke boot boot-smp2 positive-secure crossdomain spfaultneg tablesneg manifestneg keystoreneg spbudgetneg panicneg ffa-direct ffa-sint ns-smoke ffa-discovery ffa-guest-direct psci ffa-preempt positive guest1 smcfuzz secramneg resetneg ffa-memneg confboot storage devstorage

      - name: Show the boot logs
        if: always()
        run: |
          cat logs/target-smoke.log || true
          cat logs/target-boot.log || true
          cat logs/target-boot-smp2.log || true
          cat logs/target-positive-secure.log || true
          cat logs/target-crossdomain.log || true
          cat logs/target-spfaultneg.log || true
          cat logs/target-tablesneg.log || true
          cat logs/target-manifestneg.log || true
          cat logs/target-keystoreneg.log || true
          cat logs/target-spbudgetneg.log || true
          cat logs/target-panicneg.log || true
          cat logs/target-ffa-direct.log || true
          cat logs/target-ffa-sint.log || true
          cat logs/target-ns-smoke.log || true
          cat logs/target-ffa-discovery.log || true
          cat logs/target-ffa-guest-direct.log || true
          cat logs/target-psci.log || true
          cat logs/target-ffa-preempt.log || true
          cat logs/target-positive.log || true
          cat logs/target-guest1.log || true
          cat logs/target-smcfuzz.log || true
          cat logs/target-secramneg.log || true
          cat logs/target-resetneg.log || true
          cat logs/target-ffa-memneg.log || true
          cat logs/target-confboot.log || true
          cat logs/target-devstorage.log || true
          cat logs/target-storage.log || true
