name: Compiler matrix

on:
  push:
    branches: [master, main, "release/**", wolfpsa-v5.9.1-ci, wolftfm-l3, wolfTrust-dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host-unit-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolftrust-ci:latest-beb806af7628e02acee729632a74a7a3630f21fd
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 12
            cc: gcc-12
          - name: GCC 13
            cc: gcc-13
          - name: GCC 14
            cc: gcc-14
          - name: GCC 15
            cc: gcc-15
          - name: Clang 19
            cc: clang-19
          - name: Clang 21
            cc: clang-21
    steps:
      - uses: actions/checkout@v4
      - name: Initialize test dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive --depth 1 --jobs 4
      - name: Run aggregate host test suite
        run: make test CC=${{ matrix.cc }}
