name: Compiler matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host-unit-tests:
    name: host_tests_${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolftrust-ci:latest-beb806af7628e02acee729632a74a7a3630f21fd
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc_12
            cc: gcc-12
          - name: gcc_13
            cc: gcc-13
          - name: gcc_14
            cc: gcc-14
          - name: gcc_15
            cc: gcc-15
          - name: clang_19
            cc: clang-19
          - name: clang_21
            cc: clang-21
    steps:
      - uses: actions/checkout@v4
      - name: Initialize test dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive --depth 1 --jobs 4
      - name: Run aggregate host test suite
        run: make test CC=${{ matrix.cc }}
