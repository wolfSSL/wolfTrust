name: Compiler matrix

on:
  push:
    branches: [master, main, "release/**", wolfpsa-v5.9.1-ci, wolftfm-l3, wolfTrust-dev, wolfTrust-dev2]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host-unit-tests:
    name: Host tests (${{ matrix.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 12
            package: gcc-12
            cc: gcc-12
          - name: GCC 13
            package: gcc-13
            cc: gcc-13
          - name: GCC 14
            package: gcc-14
            cc: gcc-14
          - name: GCC 15
            package: gcc-15
            cc: gcc-15
          - name: Clang 17
            package: clang-17
            cc: clang-17
          - name: Clang 18
            package: clang-18
            cc: clang-18
    steps:
      - uses: actions/checkout@v4
      - name: Initialize test dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common wget
          case "${{ matrix.package }}" in
            clang-*)
              # 22.04 carries no clang-17/18; take them from the LLVM apt repository.
              wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
              pkg='${{ matrix.package }}'
              sudo bash /tmp/llvm.sh "${pkg#clang-}"
              ;;
            *)
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends ${{ matrix.package }}
              ;;
          esac
      - name: Run aggregate host test suite
        run: make test CC=${{ matrix.cc }}
