name: Cross compilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cortex-m33:
    name: cortex_m33_cross_compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize firmware dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 --jobs 4 \
            lib/wolfCOSE lib/wolfHSM lib/wolfPSA lib/wolfSSL \
            lib/wolfhal
      - name: Build STM32H563 secure firmware
        run: make -C tests/firmware/stm32h563 all TOOLPREFIX=arm-none-eabi-
      - name: Validate the LTO gate, rebuild, and size reduction
        run: |
          make BUILD_DIR=build-lto-toggle WT_LTO=0 secure-image TOOLPREFIX=arm-none-eabi-
          no_lto_flash=$(arm-none-eabi-size build-lto-toggle/wolftrust.elf | awk 'NR == 2 { print $1 + $2 }')
          grep -qx 'WT_LTO=0' build-lto-toggle/secure_build_mode.stamp
          if arm-none-eabi-readelf -SW build-lto-toggle/sec_spm.o | grep -q '\.gnu\.lto_'; then
            echo 'FAIL: WT_LTO=0 produced an LTO object' >&2
            exit 1
          fi
          make BUILD_DIR=build-lto-toggle secure-image TOOLPREFIX=arm-none-eabi-
          lto_flash=$(arm-none-eabi-size build-lto-toggle/wolftrust.elf | awk 'NR == 2 { print $1 + $2 }')
          grep -qx 'WT_LTO=1' build-lto-toggle/secure_build_mode.stamp
          arm-none-eabi-readelf -SW build-lto-toggle/sec_spm.o | grep -q '\.gnu\.lto_'
          if arm-none-eabi-readelf -SW build-lto-toggle/sec_runtime.o | grep -q '\.gnu\.lto_'; then
            echo 'FAIL: isolation-critical object was compiled with LTO' >&2
            exit 1
          fi
          test "$lto_flash" -lt "$no_lto_flash"
          echo "LTO flash: $no_lto_flash -> $lto_flash bytes"
      - name: Verify an unimplemented isolation level stops the build
        run: |
          for target in stm32h563 mimxrt700; do
            for level in 1 2; do
              if make TARGET=$target WT_ISOLATION_LEVEL=$level \
                  BUILD_DIR=build-level-$level secure-image \
                  TOOLPREFIX=arm-none-eabi- 2> level.err; then
                echo "FAIL: $target built at isolation level $level" >&2
                exit 1
              fi
              grep -q 'only isolation level 3 is implemented' level.err
              test ! -e build-level-$level/wolftrust.elf
            done
          done
      - name: Verify an unreadable level 3 layout stops the link
        run: |
          if make BUILD_DIR=build-no-layout WT_L3_BAND_ARGS= secure-image \
              TOOLPREFIX=arm-none-eabi- 2> no-layout.err; then
            echo 'FAIL: the link ran without the level 3 band layout' >&2
            exit 1
          fi
          grep -q 'cannot read the level 3 bands' no-layout.err
          test ! -e build-no-layout/wolftrust.elf
      - name: Verify a rejected secure image cannot be reused
        run: |
          reject_flag='-Wl,--defsym=malloc=0x0C060800'
          make BUILD_DIR=build-rejected-layout secure-image TOOLPREFIX=arm-none-eabi-
          test -e build-rejected-layout/wolftrust.bin
          touch build-rejected-layout/sec_spm.o
          if make BUILD_DIR=build-rejected-layout WT_EXTRA_LDFLAGS="$reject_flag" \
              secure-image TOOLPREFIX=arm-none-eabi-; then
            echo 'FAIL: forbidden heap symbol was accepted' >&2
            exit 1
          fi
          test ! -e build-rejected-layout/wolftrust.elf
          test ! -e build-rejected-layout/wolftrust.bin
          test ! -e build-rejected-layout/wolftrust.map
          test ! -e build-rejected-layout/secure_cmse_implib.o
          if make BUILD_DIR=build-rejected-layout WT_EXTRA_LDFLAGS="$reject_flag" \
              secure-image TOOLPREFIX=arm-none-eabi-; then
            echo 'FAIL: rejected secure image was reused' >&2
            exit 1
          fi
          test ! -e build-rejected-layout/wolftrust.elf
          test ! -e build-rejected-layout/wolftrust.bin
          test ! -e build-rejected-layout/wolftrust.map
          test ! -e build-rejected-layout/secure_cmse_implib.o
      - name: Compile-check the no-attestation secure image (WT_ATTEST_COSE=0)
        run: make TARGET=stm32h563 WT_ATTEST_COSE=0 secure-image TOOLPREFIX=arm-none-eabi-
      - name: Build the hsm-engine secure image (WT_ENGINE=hsm)
        run: make TARGET=stm32h563 WT_ENGINE=hsm secure-image TOOLPREFIX=arm-none-eabi- BUILD_DIR=build_hsm
      - name: Build the native-engine secure image (WT_ENGINE=native)
        run: make TARGET=stm32h563 WT_ENGINE=native secure-image TOOLPREFIX=arm-none-eabi- BUILD_DIR=build_native
      - name: Build the MIMXRT700 secure image (both engines, default layout)
        run: |
          for engine in native hsm; do
            make TARGET=mimxrt700 WT_ENGINE=$engine WT_ATTEST_COSE=0 \
              secure-image TOOLPREFIX=arm-none-eabi- \
              BUILD_DIR=build_rt700_$engine
            # The default must leave wolfBoot's 0x400 header before the vectors.
            vectors="$(arm-none-eabi-objdump -h build_rt700_$engine/wolftrust.elf \
              | awk '$2 == ".vectors" { print $4 }')"
            test "$vectors" = "38040400" || \
              { echo "RT700 .vectors at 0x$vectors, want 0x38040400"; exit 1; }
          done
      - name: Build the MIMXRT700 conformance secure image (both engines)
        run: |
          for engine in native hsm; do
            make TARGET=mimxrt700 WT_ENGINE=$engine WT_ATTEST_COSE=0 \
              WT_CONFORMANCE=1 secure-image TOOLPREFIX=arm-none-eabi- \
              BUILD_DIR=build_rt700_conf_$engine
          done
