name: Cross compilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  cortex-m33:
    name: cortex_m33_cross_compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize firmware dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --depth 1 --jobs 4 \
            lib/wolfCOSE lib/wolfHSM lib/wolfPSA lib/wolfSSL \
            lib/wolfhal
      - name: Build STM32H563 secure firmware
        run: make -C tests/firmware/stm32h563 all TOOLPREFIX=arm-none-eabi-
      - name: Validate the LTO gate, rebuild, and size reduction
        run: |
          make BUILD_DIR=build-lto-toggle WT_LTO=0 secure-image TOOLPREFIX=arm-none-eabi-
          no_lto_flash=$(arm-none-eabi-size build-lto-toggle/wolftrust.elf | awk 'NR == 2 { print $1 + $2 }')
          grep -qx 'WT_LTO=0' build-lto-toggle/secure_build_mode.stamp
          if arm-none-eabi-readelf -SW build-lto-toggle/sec_spm.o | grep -q '\.gnu\.lto_'; then
            echo 'FAIL: WT_LTO=0 produced an LTO object' >&2
            exit 1
          fi
          make BUILD_DIR=build-lto-toggle secure-image TOOLPREFIX=arm-none-eabi-
          lto_flash=$(arm-none-eabi-size build-lto-toggle/wolftrust.elf | awk 'NR == 2 { print $1 + $2 }')
          grep -qx 'WT_LTO=1' build-lto-toggle/secure_build_mode.stamp
          arm-none-eabi-readelf -SW build-lto-toggle/sec_spm.o | grep -q '\.gnu\.lto_'
          if arm-none-eabi-readelf -SW build-lto-toggle/sec_runtime.o | grep -q '\.gnu\.lto_'; then
            echo 'FAIL: isolation-critical object was compiled with LTO' >&2
            exit 1
          fi
          test "$lto_flash" -lt "$no_lto_flash"
          echo "LTO flash: $no_lto_flash -> $lto_flash bytes"
      - name: Verify an unimplemented isolation level stops the build
        run: |
          for target in $(python3 tests/target/lib/scenario_matrix.py --list-ports); do
            for level in 1 2; do
              if make TARGET=$target WT_ISOLATION_LEVEL=$level \
                  BUILD_DIR=build-level-$level secure-image \
                  TOOLPREFIX=arm-none-eabi- 2> level.err; then
                echo "FAIL: $target built at isolation level $level" >&2
                exit 1
              fi
              grep -q 'only isolation level 3 is implemented' level.err
              test ! -e build-level-$level/wolftrust.elf
            done
          done
      - name: Verify an unreadable level 3 layout stops the link
        run: |
          if make BUILD_DIR=build-no-layout WT_L3_BAND_ARGS= secure-image \
              TOOLPREFIX=arm-none-eabi- 2> no-layout.err; then
            echo 'FAIL: the link ran without the level 3 band layout' >&2
            exit 1
          fi
          grep -q 'cannot read the level 3 bands' no-layout.err
          test ! -e build-no-layout/wolftrust.elf
      - name: Verify a rejected secure image cannot be reused
        run: |
          reject_flag='-Wl,--defsym=malloc=0x0C060800'
          make BUILD_DIR=build-rejected-layout secure-image TOOLPREFIX=arm-none-eabi-
          test -e build-rejected-layout/wolftrust.bin
          touch build-rejected-layout/sec_spm.o
          if make BUILD_DIR=build-rejected-layout WT_EXTRA_LDFLAGS="$reject_flag" \
              secure-image TOOLPREFIX=arm-none-eabi-; then
            echo 'FAIL: forbidden heap symbol was accepted' >&2
            exit 1
          fi
          test ! -e build-rejected-layout/wolftrust.elf
          test ! -e build-rejected-layout/wolftrust.bin
          test ! -e build-rejected-layout/wolftrust.map
          test ! -e build-rejected-layout/secure_cmse_implib.o
          if make BUILD_DIR=build-rejected-layout WT_EXTRA_LDFLAGS="$reject_flag" \
              secure-image TOOLPREFIX=arm-none-eabi-; then
            echo 'FAIL: rejected secure image was reused' >&2
            exit 1
          fi
          test ! -e build-rejected-layout/wolftrust.elf
          test ! -e build-rejected-layout/wolftrust.bin
          test ! -e build-rejected-layout/wolftrust.map
          test ! -e build-rejected-layout/secure_cmse_implib.o
      - name: Compile-check the default port's no-attestation secure image (WT_ATTEST_COSE=0)
        run: make WT_ATTEST_COSE=0 secure-image TOOLPREFIX=arm-none-eabi-
      - name: Verify a changed layout input regenerates the secure image
        run: TOOLPREFIX=arm-none-eabi- tools/check-layout-rebuild.sh
      - name: Build every port with the boot-time manifest check (WT_MANIFEST_RUNTIME_CHECK=1)
        run: |
          for target in $(python3 tests/target/lib/scenario_matrix.py --list-ports); do
            for engine in $(python3 tests/target/lib/scenario_matrix.py --port $target --get build.engines); do
              make TARGET=$target WT_ENGINE=$engine WT_MANIFEST_RUNTIME_CHECK=1 \
                secure-image TOOLPREFIX=arm-none-eabi- \
                BUILD_DIR=build_rtcheck_${target}_$engine
              grep -qx 'WT_MANIFEST_RUNTIME_CHECK=1' \
                build_rtcheck_${target}_$engine/secure_build_mode.stamp
            done
          done
      - name: Verify only the opt-in image links the boot-time manifest validator
        run: |
          for check in 0 1; do
            make WT_LTO=0 WT_MANIFEST_RUNTIME_CHECK=$check \
              secure-image TOOLPREFIX=arm-none-eabi- \
              BUILD_DIR=build_rtcheck_nolto_$check
            if arm-none-eabi-nm build_rtcheck_nolto_$check/wolftrust.elf \
                | grep ' wt_manifest_validate$' >/dev/null; then
              linked=1
            else
              linked=0
            fi
            test "$linked" = "$check" || \
              { echo "WT_MANIFEST_RUNTIME_CHECK=$check linked=$linked" >&2; exit 1; }
          done
      # TF-M v2.3.1 level 3 tfm_s on the STM32L562E-DK is 79,680 bytes of
      # flash and 45,728 bytes of RAM, partition stacks included; the lean
      # default, attestation included as in TF-M, must stay below both
      # (docs/TF-M-Compatibility.md). A port's linked RAM code band is allowed.
      - name: Check the lean default footprint against TF-M level 3
        run: |
          budget=79680
          for target in $(python3 tests/target/lib/scenario_matrix.py --list-ports); do
            make TARGET=$target WT_ENGINE=native WT_ATTEST_COSE=1 secure-image \
              TOOLPREFIX=arm-none-eabi- BUILD_DIR=build_budget_$target
            flash=$(arm-none-eabi-size build_budget_$target/wolftrust.elf \
              | awk 'NR == 2 { print $1 + $2 }')
            echo "$target native default flash: $flash bytes (budget $budget)"
            test "$flash" -le "$budget" || \
              { echo "FAIL: $target lean default exceeds the TF-M level 3 budget" >&2; exit 1; }
            python3 tools/secure_ram.py --base-max 45728 \
              build_budget_$target/wolftrust.map
          done
      - name: Build every port's full-profile secure image (every engine)
        run: |
          flags="$(. tests/target/lib/profile.sh; scenario_profile_flags full)"
          for target in $(python3 tests/target/lib/scenario_matrix.py --list-ports); do
            for engine in $(python3 tests/target/lib/scenario_matrix.py --port $target --get build.engines); do
              # shellcheck disable=SC2086
              make TARGET=$target WT_ENGINE=$engine $flags secure-image \
                TOOLPREFIX=arm-none-eabi- BUILD_DIR=build_full_${target}_$engine
            done
          done
          if make WT_MAX_GUESTS=3 BUILD_DIR=build-guests-3 secure-image \
              TOOLPREFIX=arm-none-eabi- 2> guests.err; then
            echo 'FAIL: WT_MAX_GUESTS=3 built' >&2
            exit 1
          fi
          grep -q 'unsupported WT_MAX_GUESTS' guests.err
      - name: Build every add-on alone for every port (every engine)
        run: |
          for flag in WT_MAX_GUESTS=2 WT_FWU=1 WT_SHA256_FAST=1 WT_WOLFCRYPT_SP_ASM=1 WT_WOLFCRYPT_ARMASM=1; do
            for target in $(python3 tests/target/lib/scenario_matrix.py --list-ports); do
              for engine in $(python3 tests/target/lib/scenario_matrix.py --port $target --get build.engines); do
                dir=build_addon_${target}_${engine}_${flag%%=*}
                make TARGET=$target WT_ENGINE=$engine $flag secure-image \
                  TOOLPREFIX=arm-none-eabi- BUILD_DIR=$dir
                grep -qx "$flag" $dir/secure_build_mode.stamp
              done
            done
          done
      - name: Build every registered port (both engines, every variant, .vectors check)
        run: |
          python3 tests/target/lib/scenario_matrix.py --build-plan | python3 -c '
          import json, subprocess, sys
          for b in json.load(sys.stdin):
              port, engine = b["port"], b["engine"]
              base = ["make", "TARGET=" + port, "WT_ENGINE=" + engine,
                      "WT_ATTEST_COSE=%d" % b["attest_cose"], "secure-image",
                      "TOOLPREFIX=arm-none-eabi-"]
              out = "build_%s_%s" % (port, engine)
              subprocess.run(base + ["BUILD_DIR=" + out], check=True)
              if b["vectors"]:
                  # The default must leave wolfBoot header room before the vectors.
                  hdr = subprocess.run(["arm-none-eabi-objdump", "-h", out + "/wolftrust.elf"],
                                       check=True, capture_output=True, text=True).stdout
                  got = [l.split()[3] for l in hdr.splitlines() if len(l.split()) > 3 and l.split()[1] == ".vectors"]
                  if got != [b["vectors"]]:
                      sys.exit("%s .vectors at %s, want %s" % (port, got, b["vectors"]))
              # A variant builds in the layout its emulator and hardware runs use.
              layout = ("here=\"$PWD/tests/target\"; repo=\"$PWD\"; . \"$here/ports/$1/m33mu.sh\"; "
                        "port_layout_env; shift; exec \"$@\"")
              for variant in b["variants"]:
                  flags = {"conformance": ["WT_CONFORMANCE=1"],
                           "vnet": ["CONFIG_VNET=y", "WT_MAX_GUESTS=2"]}[variant]
                  subprocess.run(["bash", "-c", layout, "_", port] + base + flags +
                                 ["BUILD_DIR=%s_%s" % (out, variant)], check=True)
          '
