name: M33MU

on:
  # Pull requests run the STM32H563 smoke tier; MIMXRT700 and MCXN947 run on a
  # PR only with their label, ci:all, or ci:m33mu. Those labels, ci:h5, pushes
  # to main, the nightly schedule, and manual dispatch run a port's full matrix.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      port:
        description: Port whose full matrix to run (a registered port, or all)
        type: string
        default: all
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wolfboot-m33mu:
    name: ${{ matrix.config.slug }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: stm32h5-tz-psa
            slug: stm32h563_wolfboot_signed_boot_rollback
            board: nucleo_h563zi/stm32h563xx/ns
    timeout-minutes: 30
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    env:
      # Upstream wolfBoot master, including the merged wolfCOSE-backed
      # PSA/DICE attestation integration.
      WOLFBOOT_REF: 0dfad2dbc1d7107ebfa7a41375e0f7c13ff7e6cc
      ZEPHYR_BOARD: ${{ matrix.config.board }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Fetch pinned wolfBoot and dependencies
        run: |
          git clone --no-checkout https://github.com/wolfSSL/wolfBoot.git wolfBoot
          git -C wolfBoot fetch --depth 1 origin "$WOLFBOOT_REF"
          git -C wolfBoot checkout --detach "$WOLFBOOT_REF"
          git -C wolfBoot submodule update --init --single-branch

      - name: Build signed STM32H5 TrustZone wolfBoot image
        working-directory: wolfBoot
        run: |
          cp "config/examples/${{ matrix.config.name }}.config" .config
          # Force -j1: wolfBoot FORCE-regenerates include/target.h in place and
          # its objects don't depend on it, so -j can read it half-written.
          make -j1

      - name: Boot signed image under M33MU
        working-directory: wolfBoot
        run: |
          m33mu wolfboot.bin \
            test-app/image_v1_signed.bin:0x60000 \
            --uart-stdout --expect-bkpt 0x7f --timeout 600 \
            | tee "$RUNNER_TEMP/wolfboot-m33mu.log"
          grep -q "\\[BKPT\\] imm=0x7f" "$RUNNER_TEMP/wolfboot-m33mu.log"
          grep -q "\\[EXPECT BKPT\\] Success" "$RUNNER_TEMP/wolfboot-m33mu.log"

      - name: Run wolfBoot update and rollback lifecycle
        working-directory: wolfBoot
        env:
          SCENARIOS: A,B,C
          TARGET: stm32h5
          BOOT_TIMEOUT: 30
          UPDATE_TIMEOUT: 30
          REBOOT_TIMEOUT: 30
        run: |
          ./test-app/emu-test-apps/test.sh

  # Label-selected, the wolfProvider way: one select job reads the ci:* labels
  # (ci:h5, ci:rt700 or ci:mcxn947 for that port's full matrix when only that port
  # changed, ci:all or ci:m33mu for everything after a core change, no label
  # for the STM32H563 smoke tier), the event, and the dispatch input, then one
  # matrix job runs exactly those scenario groups, so nothing shows up skipped.
  select:
    name: m33mu_select
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: p
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PORT_INPUT: ${{ inputs.port }}
        run: |
          python3 tests/target/lib/scenario_matrix.py --selftest
          matrix=$(python3 tests/target/lib/scenario_matrix.py --ci-plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          printf '%s' "$matrix" | python3 -c 'import json, sys
          for e in json.load(sys.stdin):
              print(e["job"], "(" + e["engine"] + ")")'

  scenarios:
    name: ${{ matrix.job }}
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    timeout-minutes: 45
    container:
      image: ${{ matrix.image }}
    env:
      WT_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:

      # The RT700 and MCXN947 wolfBoot first stages build against the
      # MCUXpresso SDK, staged the way wolfBoot's own imxrt700 emulator
      # workflow stages it, one board per port.
      - uses: actions/checkout@v4
        if: matrix.mcuxsdk_board != ''
        with:
          repository: nxp-mcuxpresso/CMSIS_5
          ref: f9cf5df6d51a95f0146930d75af3d71977cf795a
          path: CMSIS_5

      - name: Cache MCUXpresso SDK
        if: matrix.mcuxsdk_board != ''
        id: cache-mcuxpresso
        uses: actions/cache@v4
        with:
          path: |
            mcuxpresso-sdk
            venv
          key: mcuxpresso-sdk-${{ matrix.mcuxsdk_board }}-${{ hashFiles('.github/workflows/m33mu.yml') }}

      - name: Setup MCUXpresso SDK
        if: matrix.mcuxsdk_board != '' && steps.cache-mcuxpresso.outputs.cache-hit != 'true'
        env:
          SDK_BOARD: ${{ matrix.mcuxsdk_board }}
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install west==1.5.0
          west init -m https://github.com/nxp-mcuxpresso/mcuxsdk-manifests.git \
            --mr v26.06.00-LTS mcuxpresso-sdk
          cd mcuxpresso-sdk
          sed -i '/se_hostlib\|emwin/d' "manifests/boards/$SDK_BOARD.yml"
          west update_board --set board "$SDK_BOARD"

      - name: Run target scenarios
        env:
          MCUXSDK: ${{ matrix.mcuxsdk_board != '' && '1' || '' }}
          MCUXPRESSO: ${{ github.workspace }}/mcuxpresso-sdk/mcuxsdk
          MCUXPRESSO_CMSIS: ${{ github.workspace }}/CMSIS_5/CMSIS
        run: tests/target/run_suite.sh ${{ matrix.port }} ${{ matrix.key }}
