name: Nightly dependency validation

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  c99:
    uses: ./.github/workflows/c99-compliance.yml

  house-style:
    uses: ./.github/workflows/house-style.yml

  empty-brace-scan:
    uses: ./.github/workflows/empty-brace-scan.yml

  unit:
    uses: ./.github/workflows/unit-tests.yml

  integrations:
    uses: ./.github/workflows/integration-tests.yml

  compilers:
    uses: ./.github/workflows/compiler-matrix.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  valgrind:
    uses: ./.github/workflows/valgrind.yml

  cross-compile:
    uses: ./.github/workflows/cross-compile.yml

  core-port-split:
    uses: ./.github/workflows/core-port-split.yml

  m33mu:
    uses: ./.github/workflows/m33mu.yml
