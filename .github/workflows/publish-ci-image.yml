name: Publish CI image

# Builds docker/wolftrust-ci/Dockerfile and pushes it to
# ghcr.io/wolfssl/wolftrust-ci:latest so the host build/test jobs just pull the
# image instead of apt-get installing toolchains on every run.
#
# Published out of band, like wolfBoot's CI images: only accepted main/master
# state produces :latest, so PR jobs pull a known-good image and never race a
# concurrent rebuild. A PR that changes the Dockerfile is validated by the
# build-check job below (build only, no push); a maintainer runs this workflow
# via workflow_dispatch to seed or refresh :latest.

on:
  push:
    # ci/wolftrust-ci-image seeds :latest before the image lands on main.
    branches: [master, main, ci/wolftrust-ci-image]
    paths:
      - 'docker/wolftrust-ci/**'
      - '.github/workflows/publish-ci-image.yml'
  pull_request:
    paths:
      - 'docker/wolftrust-ci/**'
      - '.github/workflows/publish-ci-image.yml'
  workflow_dispatch: {}

concurrency:
  # Global single group: every push/dispatch publishes the shared :latest tag,
  # so only one build at a time.
  group: publish-ci-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Push mutable :latest only for accepted main/master state (or a manual
    # dispatch). Pull requests fall through to build-check instead.
    if: |
      github.repository == 'wolfSSL/wolfTrust' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve image SHA
        id: sha
        run: echo "image_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: docker/wolftrust-ci
          file: docker/wolftrust-ci/Dockerfile
          push: true
          tags: |
            ghcr.io/wolfssl/wolftrust-ci:latest
            ghcr.io/wolfssl/wolftrust-ci:latest-${{ steps.sha.outputs.image_sha }}
          cache-from: type=registry,ref=ghcr.io/wolfssl/wolftrust-ci:latest
          cache-to: type=inline

  build-check:
    # PRs that touch the image build it to prove it still builds, but never
    # push a tag - no ghcr credentials needed, no race with :latest.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker/wolftrust-ci
          file: docker/wolftrust-ci/Dockerfile
          push: false
          cache-from: type=registry,ref=ghcr.io/wolfssl/wolftrust-ci:latest
